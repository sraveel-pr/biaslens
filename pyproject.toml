[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sraveel-pr-biaslens"
version = "0.1.0"
description = "对不同子群样本计算指标差异，给出差异幅度与显著性"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sraveel-pr" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sraveel-pr.github.io"
Repository = "https://github.com/sraveel-pr/biaslens"
Issues = "https://github.com/sraveel-pr/biaslens/issues"

[project.scripts]
biaslens = "biaslens:main"

[tool.setuptools]
py-modules = ["biaslens"]
